name: Update video library

on:
  schedule:
    - cron: '23 5,17 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-video-library
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Fetch videos without downloading any media
        run: node scripts/sync-videos.mjs
      - name: Save the last successful video library
        run: |
          if git diff --quiet -- src/data/videos.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/videos.json
          git commit -m 'Update saved YouTube video library'
          git push origin HEAD:main
